<!doctype html><html><head><meta charset="utf-8"><title>QLDA connection</title></head><body><script>
(()=>{'use strict';
const nonce='<?= nonce ?>',origin='https://erhkythuatkhoi.github.io',channel='QLDA_V8_UI';
const methods=new Set(["ERH_AUTH_changePassword","ERH_AUTH_checkSession","ERH_AUTH_login","ERH_AUTH_logout","QLVH_BC02_EDIT_LOAD_R40","QLVH_BC02_EDIT_SAVE_R40","QLVH_BC02_LIST_SAVED","QLVH_BC02_OPEN_SAVED","QLVH_BC02_PRECHECK","QLVH_BC02_READ","QLVH_BC02_REVISE","QLVH_BC02_SAVE","QLVH_BC02_SIG_APPLY","QLVH_BC02_SIG_READ","QLVH_BC02_SIG_TEMPLATE_READ","QLVH_BC02_SIG_TEMPLATE_UPLOAD","QLVH_BC02_SIG_UPLOAD","QLVH_BC02_SYNC_COMMIT_R37","QLVH_BC02_SYNC_PREVIEW_R37","QLVH_CV08_FILE_CANCEL","QLVH_CV08_FILE_GET","QLVH_CV08_FILE_LIST","QLVH_CV08_FILE_RENAME","QLVH_CV08_FILE_REPLACE","QLVH_CV08_FILE_UPLOAD","QLVH_CV08_KIND_GET","QLVH_CV08_KIND_SET","QLVH_CV08_LIST","QLVH_CV08_SAVE","QLVH_HS12_DELETE","QLVH_HS12_FILE_CANCEL","QLVH_HS12_FILE_GET","QLVH_HS12_FILE_LIST","QLVH_HS12_FILE_RENAME","QLVH_HS12_FILE_UPLOAD","QLVH_HS12_LIST","QLVH_HS12_SAVE","QLVH_HS12_STAFF","QLVH_NS01_BUNDLE","QLVH_NS02A_SAVE_PROFILE","QLVH_NS02B_CREATE","QLVH_NS03A_LIST","QLVH_NS03A_PREPARE","QLVH_NS04_LIST","QLVH_NS04_REVOKE_GRANT","QLVH_NS04_SAVE_GRANT","QLVH_NS04_SAVE_STAFF","QLVH_NS04_SET_INITIAL_PASSWORD","QLVH_PJ18_READ","QLVH_PJ18_READ_R17","QLVH_PJ18_STAFF","QLVH_PJ26_DASHBOARD","QLVH_TD01_CREATE","QLVH_TD01_DRAFT_OPEN","QLVH_TD01_DRAFT_UPDATE","QLVH_TD01_FILE_GET","QLVH_TD01_FILE_LIST","QLVH_TD01_FILE_UPLOAD","QLVH_TD01_LIST","QLVH_TD08_CATALOG_SAVE","QLVH_TD16_PENDING_LIST","QLVH_TD16_SUBMIT","QLVH_TD17_DRAFT_DELETE","QLVH_XK01_FILE_GET","QLVH_XK01_QUEUE","QLVH_XK01_RECIPIENTS","QLVH_XK01_REPLY","QLVH_XK01_SEND","QLVH_XK01_SUPPLEMENT","QLVH_XL02_APPLY","QLVH_XL02_LIST","QLVH_XL03_FILE_ADD","QLVH_XL03_FILE_DELETE","QLVH_XL03_FILE_GET","QLVH_XL03_PLAN_SET","QLVH_XL03_REPORT_LIST","QLVH_XL03_REPORT_RECEIPT","QLVH_XL03_REPORT_SAVE","QLVH_XL03_SUBMIT_REVIEW"]);
if(window.top===window||! /^[a-f0-9]{64}$/.test(nonce))return;
const send=(type,extra={})=>window.top.postMessage({channel,nonce,type,...extra},origin);
const busy=new Set();let acknowledged=false;
const hello=()=>send('READY');let heartbeat=setInterval(hello,1000);
window.addEventListener('message',e=>{
 if(e.origin!==origin||e.source!==window.top)return;
 const d=e.data;if(!d||d.channel!==channel||d.nonce!==nonce)return;
 if(d.type==='ACK'){acknowledged=true;clearInterval(heartbeat);return;}
 if(!acknowledged||d.type!=='RPC'||! /^[a-f0-9]{32}$/.test(d.id||'')||busy.has(d.id))return;
 if(!methods.has(d.method)||!Array.isArray(d.args)||d.args.length>20||busy.size>=16){send('RESULT',{id:d.id,ok:false,code:'RPC_DENIED'});return;}
 busy.add(d.id);let finished=false;
 const done=(ok,value)=>{if(finished)return;finished=true;busy.delete(d.id);if(ok){try{send('RESULT',{id:d.id,ok:true,value});}catch(_){send('RESULT',{id:d.id,ok:false,code:'RPC_SERIALIZATION'});}}else send('RESULT',{id:d.id,ok:false,code:value});};
 try{const r=google.script.run.withSuccessHandler(v=>done(true,v)).withFailureHandler(err=>{const missing=/script function not found|function.*not found|is not a function/i.test(String(err&&err.message||''));done(false,missing?'RPC_FUNCTION_MISSING':'RPC_FAILED');});
 if(typeof r[d.method]!=='function'){done(false,'RPC_FUNCTION_MISSING');return;}r[d.method].apply(r,d.args);
 }catch(_){done(false,'RPC_FAILED');}
});hello();setTimeout(()=>clearInterval(heartbeat),30000);
})();
</script></body></html>
