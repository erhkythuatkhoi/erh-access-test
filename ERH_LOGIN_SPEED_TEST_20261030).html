<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ERH LOGIN SPEED TEST</title><style>body{font:16px Arial;background:#eef3f9;margin:0;color:#172d43}main{max-width:680px;margin:30px auto;background:white;padding:24px;border-radius:14px}h1{font-size:22px}label{display:block;margin:14px 0 5px}input{width:100%;padding:11px;box-sizing:border-box}button{border:0;background:#195b93;color:white;padding:12px;border-radius:8px;margin:13px 5px 0 0;cursor:pointer}button:disabled{opacity:.6}pre{white-space:pre-wrap;background:#f4f7fc;padding:15px;border-radius:8px}small{color:#657486}.warn{background:#fff0d5;padding:12px;border-radius:8px}</style></head><body><main><h1>ERH – Kiểm tra tốc độ đăng nhập</h1><p class="warn">CHỈ DÙNG API TEST RIÊNG VÀ TÀI KHOẢN GIẢ TEST. Không nhập mã nhân viên/mật khẩu thật của App Tổng.</p><label>URL API TEST Apps Script (/exec)</label><input id="url" placeholder="https://script.google.com/macros/s/.../exec"><label>Mã nhân viên TEST</label><input id="staff" value="TEST01"><label>Mật khẩu TEST</label><input type="password" id="password"><button id="ping">1. PING</button><button id="login">2. LOGIN</button><button id="check">3. SESSIONCHECK</button><button id="restore">4. RESTORE</button><button id="logout">5. LOGOUT</button><button id="clear">Xóa phiên</button><h3>Kết quả đo</h3><pre id="log">Chưa kiểm tra.</pre><small>Trang này không truy cập dữ liệu nghiệp vụ và không thay đổi App Tổng V10. Phiên TEST chỉ lưu trong sessionStorage của tab hiện tại.</small></main><script>
'use strict';const $=id=>document.getElementById(id),KEY='ERH_SPEED_TEST_ONLY';let token='',busy=false;const allowed=new Set(['https://script.google.com','https://script.googleusercontent.com']);function line(s){$('log').textContent+='\n'+new Date().toLocaleTimeString('vi-VN')+' '+s}function endpoint(){const u=new URL($('url').value.trim());if(u.protocol!=='https:'||u.hostname!=='script.google.com'||!/^\/macros\/s\/[\w-]+\/exec$/.test(u.pathname)||u.search)throw Error('Chỉ nhận URL Apps Script TEST /exec không có tham số');return u.href}
function req(api,fields={}){return new Promise((resolve,reject)=>{let url;try{url=endpoint()}catch(e){return reject(e)}const nonce=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join(''),frame=document.createElement('iframe'),form=document.createElement('form');frame.name='test_'+nonce;frame.hidden=true;form.hidden=true;form.method='POST';form.action=url;form.target=frame.name;for(const [k,v] of Object.entries({api,nonce,...fields})){const input=document.createElement('input');input.name=k;input.value=String(v??'');form.append(input)}let done=false;const timer=setTimeout(()=>finish(Error('TIMEOUT 20 giây')),20000);function finish(err,data){if(done)return;done=true;clearTimeout(timer);window.removeEventListener('message',receive);form.remove();frame.remove();err?reject(err):resolve(data)}function receive(e){if(!allowed.has(e.origin)&&!/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$/.test(e.origin))return;const d=e.data;if(d?.app!=='ERH_ACCESS_ISOLATED_TEST_V1'||d.nonce!==nonce)return;d.ok?finish(null,d):finish(Error(d.error||'API FAIL'))}window.addEventListener('message',receive);document.body.append(frame,form);form.submit()})}async function call(name,work){if(busy)return;busy=true;for(const b of document.querySelectorAll('button'))b.disabled=true;const start=performance.now();try{const data=await work();line(name+' PASS · '+Math.round(performance.now()-start)+' ms');return data}catch(e){line(name+' FAIL · '+Math.round(performance.now()-start)+' ms · '+e.message)}finally{busy=false;for(const b of document.querySelectorAll('button'))b.disabled=false}}
$('ping').onclick=()=>call('PING',()=>req('ping'));$('login').onclick=()=>call('LOGIN',async()=>{const d=await req('login',{staff:$('staff').value.trim(),password:$('password').value});$('password').value='';if(!d.sessionToken)throw Error('Thiếu sessionToken');token=d.sessionToken;sessionStorage.setItem(KEY,JSON.stringify({url:$('url').value,token}));return d});$('check').onclick=()=>call('SESSIONCHECK',()=>{if(!token)throw Error('Chưa có phiên');return req('sessioncheck',{sessionToken:token})});$('restore').onclick=()=>call('RESTORE',async()=>{const d=JSON.parse(sessionStorage.getItem(KEY)||'null');if(!d?.token||!d?.url)throw Error('Chưa có phiên lưu');$('url').value=d.url;const reply=await req('sessioncheck',{sessionToken:d.token});token=d.token;return reply});$('logout').onclick=()=>call('LOGOUT',async()=>{const d=token?await req('logout',{sessionToken:token}):null;token='';sessionStorage.removeItem(KEY);return d});$('clear').onclick=()=>{token='';sessionStorage.removeItem(KEY);line('Đã xóa phiên TEST')};const prev=JSON.parse(sessionStorage.getItem(KEY)||'null');if(prev?.url)$('url').value=prev.url;
</script></body></html>
