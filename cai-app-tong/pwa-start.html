</head><body><div><p>Đang mở ERH APP TỔNG…</p><p id="fallback" hidden><a id="open" href="../app-tong-test.html">Chạm để mở ứng dụng</a></p></div>
<script src="./launcher-config.js"></script><script>
(function(){'use strict';const u=String((window.LAUNCHER_CONFIG||{}).TARGET_URL||'').trim();
 const safe=u&&new URL(u,location.href);
 if(safe&&safe.origin===location.origin&&safe.pathname==='/erh-access-test/app-tong-test.html'){
   document.getElementById('open').href=safe.href;
   location.replace(safe.href);
 } else { document.querySelector('body p').textContent='Cấu hình đường dẫn App Tổng chưa hợp lệ.';document.getElementById('fallback').hidden=false; }
})();
</script></body></html>
